<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress | Sign in</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Arial, sans-serif; color: #30304f; background: #f7f7f7; }
    body { margin: 0; }
    .login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; min-height: 100svh; }
    .brand { display: grid; place-items: center; background: #0759db; color: white; padding: 40px; }
    .brand h1 { font-size: clamp(28px, 3vw, 42px); }
    .content { display: grid; place-items: center; padding: 48px 32px; }
    .form-container { width: 100%; max-width: 340px; }
    h2 { font-size: 22px; font-weight: 400; margin: 0 0 22px; }
    h2 strong { font-weight: 700; }
    .intro { color: #858596; font-size: 13px; line-height: 1.6; margin: 0 0 48px; }
    form { display: grid; gap: 20px; }
    .field { display: grid; gap: 8px; }
    label { font-size: 12px; font-weight: 700; padding-left: 12px; }
    .input-wrapper { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid transparent; border-radius: 12px; padding: 0 14px; }
    .input-wrapper:focus-within { outline: 2px solid #0759db; outline-offset: 2px; }
    svg { width: 17px; height: 17px; flex-shrink: 0; fill: none; stroke: #858596; stroke-width: 1.5; }
    input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; padding: 15px 0; font: inherit; font-size: 13px; color: #30304f; }
    input::placeholder { color: #a1a1ad; }
    .eye { display: flex; align-items: center; }
    .forgot { justify-self: end; margin-top: -8px; font-size: 11px; }
    a { color: #0759db; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible { outline: 2px solid #0759db; outline-offset: 4px; }
    .submit { justify-self: start; min-width: 170px; border: 0; border-radius: 12px; background: #0759db; color: white; padding: 16px 24px; font: inherit; font-size: 13px; cursor: pointer; margin-top: 26px; }
    .submit:hover { background: #064abb; }
    .signup { display: none; font-size: 11px; color: #858596; text-align: center; margin-top: 42px; }
    @media (min-width: 601px) and (max-width: 900px) {
      .login { grid-template-columns: 45% 55%; }
      .brand { padding: 24px; }
      .content { padding: 40px 24px; }
      .brand h1 { font-size: 28px; }
    }
    @media (max-width: 600px) {
      .login { grid-template-columns: 1fr; }
      .brand { display: none; }
      .content { align-items: start; padding: 100px 28px 48px; }
      .form-container { max-width: 380px; }
      h2 { font-size: 22px; margin-bottom: 18px; }
      .intro { margin-bottom: 30px; }
      label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .input-wrapper { border-radius: 5px; }
      form { gap: 24px; }
      .submit { width: 100%; border-radius: 6px; margin-top: 20px; }
      .signup { display: block; }
    }
    @media (max-width: 360px) { .content { padding: 72px 20px 32px; } }
  </style>
</head>
<body>
  <main class="login">
    <section class="brand" aria-label="AdminExpress"><h1>AdminExpress</h1></section>
    <section class="content" aria-labelledby="login-title">
      <div class="form-container">
        <h2 id="login-title">Let’s <strong>Sign In</strong> <span aria-hidden="true">👇</span></h2>
        <p class="intro">Hey, Enter your details to get sign in<br>to your account.</p>
        <form action="#" method="post" onsubmit="event.preventDefault(); alert('Demo de diseño: no hay un servicio de autenticación conectado.');">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
              <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="username" required>
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
              <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="current-password" required>
              <span class="eye" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 21 21 3"/></svg></span>
            </div>
          </div>
          <a class="forgot" href="#" onclick="alert('Demo de diseño: recuperación de contraseña pendiente de conectar.'); return false;">Forgot password?</a>
          <button class="submit" type="submit">Sign in</button>
        </form>
        <p class="signup">Don't have an account? <a href="#" onclick="alert('Demo de diseño: registro pendiente de conectar.'); return false;">Sign Up</a></p>
      </div>
    </section>
  </main>
</body>
</html>
